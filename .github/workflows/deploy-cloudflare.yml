name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to deploy
        type: choice
        options: [user, admin, both]
        default: both
      target:
        description: Deployment environment
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.value }}
    steps:
      - id: apps
        env:
          APP: ${{ inputs.app }}
        run: |
          if [ "$APP" = both ]; then
            echo 'value=["user","admin"]' >> "$GITHUB_OUTPUT"
          else
            printf 'value=["%s"]\n' "$APP" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    environment: cloudflare-${{ inputs.target }}
    concurrency:
      group: cloudflare-${{ matrix.app }}-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Only frontend is needed. Checkout the exact recorded commit, not branch HEAD.
      - name: Checkout frontend submodule
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
        run: |
          git -c 'url.https://github.com/.insteadOf=git@github.com:' -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" submodule update --init frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: |
          bun install --cwd deploy/cloudflare --frozen-lockfile --ignore-scripts
          bun install --cwd frontend --frozen-lockfile --ignore-scripts
      - name: Test deployment and proxy
        run: |
          bun run --cwd deploy/cloudflare typecheck
          bun test deploy/cloudflare
          bun test frontend/tests/functions
      - name: Build and deploy
        working-directory: deploy/cloudflare
        env:
          APP: ${{ matrix.app }}
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ matrix.app == 'user' && (vars.CF_USER_PROJECT || 'ppanel-user') || (vars.CF_ADMIN_PROJECT || 'ppanel-admin') }}
          SITE_ORIGIN: ${{ matrix.app == 'user' && vars.CF_USER_ORIGIN || vars.CF_ADMIN_ORIGIN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CF_PRODUCTION_BRANCH: ${{ vars.CF_PRODUCTION_BRANCH || 'main' }}
          CF_PREVIEW_BRANCH: preview-${{ github.ref_name }}
        run: bun run deploy.ts "$APP" "$TARGET"
